<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" lang="en">
<head th:replace="~{common/header :: common-header}" />
<body roleId="page-top" data-spy="scroll"
	data-target=".navbar-fixed-top">
<head th:replace="~{common/header :: navbar}" />

<div class="container">

	<div class="row">
		<div class="col-lg-12">
			<h1 class="page-header">Find Replace</h1>
		</div>
	</div>

	<form class="form-horizontal" method="post" th:action="@{/findreplace}">

		<div class="row">

			<div class="col-md-2 form-group">

				<label for="username" class="cols-sm-2 control-label">Select
					Field</label>


				<div class="cols-sm-10">
					<div class="input-group">
						<select class="form-control" name="option" required>
							<option value="1">*</option>
							<option value="2">Title</option>
							<option value="3">Description</option>
							<option value="4">Keywords</option>
							<option value="5">Subjects</option>
						</select>
					</div>
				</div>

			</div>

			<div class="col-md-1 form-group"></div>

			<div class="col-md-4 form-group">

				<label class="control-label">Find</label> <input type="text"
					class="form-control" name="find" required="required" />


			</div>

			<div class="col-md-1 form-group"></div>

			<div class="col-md-4 form-group">

				<label class="control-label">Replace</label> <input type="text"
					class="form-control" name="replace" required="required" />

			</div>
		</div>

		<div class="form-group ">
			<button type="submit"
				class="btn btn-primary btn-lg btn-block login-button">Submit</button>
		</div>

	</form>




</div>

</body>

<div th:replace="~{common/footer :: footer}"></div>

<div th:replace="~{common/header :: body-bottom-scripts}"></div>

</html>
