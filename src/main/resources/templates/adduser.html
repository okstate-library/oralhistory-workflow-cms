<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" lang="en">
<head th:replace="common/header :: common-header" />
<body data-spy="scroll" data-target=".navbar-fixed-top">
<head th:replace="common/header :: navbar" />
<div class="container">
	<div class="row">
		<div class="col-lg-12">
			<h1 class="page-header">Add User</h1>
		</div>
	</div>

	<form class="form-horizontal" method="post" th:object="${user}"
		th:action="@{/adduser}">
		<div class="row">



			<div class="col-md-5 form-group">
				<label class="control-label">First Name</label> <input type="text"
					class="form-control" id="firstName" name="firstName"
					required="required" />

			</div>


			<div class="col-md-2 form-group"></div>


			<div class="col-md-5 form-group">
				<label class="control-label">Username</label> <input type="text"
					class="form-control" id="username" name="username"
					required="required" />

			</div>
		</div>

		<div class="row">

			<div class="col-md-5 form-group">
				<label class="control-label">Last Name</label> <input type="text"
					class="form-control" id="lastName" name="lastName"
					required="required" />

			</div>



			<div class="col-md-2 form-group"></div>

			<div class="col-md-5 form-group">
				<label class="control-label">Password</label> <input type="password"
					class="form-control" id="password" name="password"
					required="required" />

			</div>


		</div>

		<div class="row">

			<div class="col-md-5 form-group">
				<label class="control-label">Email</label> <input type="text"
					class="form-control" id="email" name="email" required="required" />

			</div>



			<div class="col-md-2 form-group"></div>

			<div class="col-md-5 form-group">

				<label for="username" class="cols-sm-2 control-label">Role</label>


				<div class="cols-sm-10">
					<div class="input-group">
						<select class="form-control" id="roleDropDown" name="roleId"
							required>
							<option value="">Select Role</option>

							<option value="1">User</option>
							<option value="2">Staff</option>
						</select>
					</div>
				</div>
			</div>


		</div>

		<div class="row">
			<div class="col-md-12 form-group">

				<button type="submit"
					class="btn btn-primary btn-lg btn-block login-button">Submit</button>

			</div>
		</div>
	</form>
</div>
<



<div th:replace="common/footer :: footer"></div>

<div th:replace="common/header :: body-bottom-scripts"></div>

</body>
</html>
