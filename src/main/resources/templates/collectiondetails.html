<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" lang="en">
<head th:replace="common/header :: common-header" />
<body roleId="page-top" data-spy="scroll"
	data-target=".navbar-fixed-top">
<head th:replace="common/header :: navbar" />

<div class="container" th:if="${collectiondetails != null}">

	<div class="row">
		<div class="col-lg-12">
			<h1 class="page-header ">Collection Details</h1>
		</div>
	</div>

	<form method="post" th:action="@{/collections/update}">


		<input type="hidden" name="id" th:value="*{collectiondetails?.Id}" />

		<div class="row  row-striped">

			<div class="col-md-5 form-group">
				<label> Select Repository</label>
				<div class="cols-sm-10">
					<select class="form-control" name="RepositoryId" required>
						<option value="">Select Repository</option>

						<option th:each="repo : ${repositories}" th:value="${repo.Id}"
							th:text="${repo.RepositoryName}"
							th:selected="${repo.Id} == *{collectiondetails?.RepositoryId}"></option>
					</select>
				</div>

			</div>

			<div class="col-md-2 form-group"></div>

			<div class="col-md-5 form-group">
				<label for="firstName"> Collection Name</label>
				<div class="cols-sm-10">
					<input type="text" class="form-control"
						th:value="*{collectiondetails?.CollectionName}"
						name="CollectionName" required="required" />

				</div>

			</div>
		</div>

		<div class="row  row-striped">

			<div class="col-md-5 form-group">
				<label class="control-label">Code</label> <input type="text"
					class="form-control" th:value="*{collectiondetails?.Code}"
					id="Code" name="Code" />
			</div>

			<div class="col-md-2 form-group"></div>

			<div class="col-md-5 form-group">
				<label class="control-label">Dates</label> <input type="text"
					class="form-control dates" th:value="*{collectiondetails?.Dates}"
					id="Dates" name="Dates" />

			</div>
		</div>

		<div class="row  row-striped">

			<div class="col-md-12 form-group">
				<label class="control-label">Note</label>


				<textarea class="form-control" id="Note" name="Note" rows="5"
					th:inline="text">[[${collectiondetails?.Note}]]</textarea>

			</div>


		</div>

		<div class="row  row-striped">
			<div class="col-md-12 form-group">
				<label class="control-label">Description</label>

				<textarea class="form-control" id="Description" name="Description"
					rows="5" th:inline="text">[[${collectiondetails?.Description}]]</textarea>

			</div>
		</div>

		<div class="row  row-striped">

			<div class="col-md-12 form-group">
				<label class="control-label">Subjects</label> <input type="text"
					class="form-control" th:value="*{collectiondetails?.Subjects}"
					id="Subjects" name="Subjects" />
			</div>


		</div>

		<div class="row  row-striped">
			<div class="col-md-12 form-group">
				<label class="control-label">Keywords</label> <input type="text"
					class="form-control" th:value="*{collectiondetails?.Keywords}"
					id="Keywords" name="Keywords" />

			</div>
		</div>

		<div class="row  row-striped">
			<div class="col-md-12 form-group">
				<label class="control-label">Scope And Content</label>

				<textarea class="form-control" id="ScopeAndContent"
					name="ScopeAndContent" rows="5" th:inline="text">[[${collectiondetails?.ScopeAndContent}]]</textarea>


			</div>
		</div>

		<div class="row  row-striped">

			<div class="col-md-12 form-group">
				<label class="control-label">Custodial History</label>

				<textarea class="form-control" id="CustodialHistory"
					name="CustodialHistory" rows="5" th:inline="text">[[${collectiondetails?.CustodialHistory}]]</textarea>


			</div>


		</div>

		<div class="row  row-striped">
			<div class="col-md-12 form-group">
				<label class="control-label">Acquisition info</label>

				<textarea class="form-control" id="Acquisitioninfo"
					name="Acquisitioninfo" rows="5" th:inline="text">[[${collectiondetails?.Acquisitioninfo}]]</textarea>


			</div>
		</div>

		<div class="row  row-striped">

			<div class="col-md-5 form-group">
				<label class="control-label">Number Of Interviews</label> <input
					type="text" class="form-control" readonly="readonly"
					th:value="*{collectiondetails?.NumberOfInterviews}"
					id="NumberOfInterviews" name="NumberOfInterviews" />
			</div>

			<div class="col-md-2 form-group"></div>

			<div class="col-md-5 form-group">
				<label class="control-label">Language</label> <input type="text"
					class="form-control" th:value="*{collectiondetails?.Language}"
					id="Language" name="Language" />

			</div>
		</div>

		<div class="row  row-striped">
			<div class="col-md-12 form-group">
				<label class="control-label">Publisher</label>


				<textarea class="form-control" id="Publisher" name="Publisher"
					rows="5" th:inline="text">[[${collectiondetails?.Publisher}]]</textarea>



			</div>
		</div>

		<div class="row  row-striped">

			<div class="col-md-12 form-group">
				<label class="control-label">Rights</label>

				<textarea class="form-control" id="Rights" name="Rights" rows="5"
					th:inline="text">[[${collectiondetails?.Rights}]]</textarea>

			</div>


		</div>

		<div class="row  row-striped">
			<div class="col-md-12 form-group">
				<label class="control-label">Preservation Note</label>
				<textarea class="form-control" id="PreservationNote"
					name="PreservationNote" rows="5" th:inline="text">[[${collectiondetails?.PreservationNote}]]</textarea>


			</div>
		</div>

		<div class="row  row-striped">

			<div class="col-md-5 form-group">
				<label class="control-label">Format</label> <input type="text"
					class="form-control" th:value="*{collectiondetails?.Format}"
					id="Format" name="Format" />
			</div>

			<div class="col-md-2 form-group"></div>

			<div class="col-md-5 form-group">
				<label class="control-label">Type</label> <input type="text"
					class="form-control" th:value="*{collectiondetails?.Type}"
					id="Type" name="Type" />

			</div>
		</div>

		<div class="row  row-striped">
			<div class="col-md-12 form-group">
				<label class="control-label">Access Restrictions</label>

				<textarea class="form-control" id="AccessRestrictions"
					name="AccessRestrictions" rows="5" th:inline="text">[[${collectiondetails?.AccessRestrictions}]]</textarea>


			</div>
		</div>
		<div class="row  row-striped">
			<div class="col-md-12 form-group">
				<label class="control-label">Preferred Citation</label>

				<textarea class="form-control" id="PreferredCitation"
					name="PreferredCitation" rows="5" th:inline="text">[[${collectiondetails?.PreferredCitation}]]</textarea>


			</div>
		</div>
		<div class="row  row-striped">
			<div class="col-md-12 form-group">
				<label class="control-label">Related Collection</label> <input
					type="text" class="form-control"
					th:value="*{collectiondetails?.RelatedCollection}"
					id="RelatedCollection" name="RelatedCollection" />

			</div>
		</div>
		<div class="row  row-striped">
			<div class="col-md-12 form-group">
				<label class="control-label">Project Process</label>

				<textarea class="form-control" id="ProjectProcess"
					name="ProjectProcess" rows="5" th:inline="text">[[${collectiondetails?.ProjectProcess}]]</textarea>


			</div>
		</div>
		<div class="row  row-striped">
			<div class="col-md-12 form-group">
				<label class="control-label">Creator</label> <input type="text"
					class="form-control" th:value="*{collectiondetails?.Creator}"
					id="Creator" name="Creator" />

			</div>
		</div>
		<div class="row  row-striped">
			<div class="col-md-12 form-group">
				<label class="control-label">Contributors</label> <input type="text"
					class="form-control" th:value="*{collectiondetails?.Contributors}"
					id="Contributors" name="Contributors" />

			</div>
		</div>

		<div class="row  row-striped">
			<div class="col-md-12 form-group">
				<label class="control-label">Sponsors</label> <input type="text"
					class="form-control" th:value="*{collectiondetails?.Sponsors}"
					id="Sponsors" name="Sponsors" />

			</div>
		</div>

		<div class="row row-striped"></div>

		<div class="form-group" th:if="${user.authorized.contains(5)}">
			<button type="submit" class="btn btn-primary btn-block ">Submit</button>
		</div>

	</form>

	<form method="post" th:action="@{/collections/delete}"
		th:if="${sersiesCount == 0 && user.authorized.contains(5)}">
		<input type="hidden" name="id" th:value="*{collectiondetails?.Id}" />
		<div class="form-group ">
			<button type="submit" class="btn btn-warning btn-block ">Delete</button>
		</div>
	</form>

</div>


<div th:replace="common/footer :: footer"></div>

<div th:replace="common/header :: body-bottom-scripts"></div>

</body>
</html>
