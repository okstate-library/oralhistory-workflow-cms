<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" lang="en">
<head th:replace="common/header :: common-header" />
<body roleId="page-top" data-spy="scroll"
	data-target=".navbar-fixed-top">
<head th:replace="common/header :: navbar" />

<div class="container">

	<div class="row">
		<div class="col-lg-12">
			<h1 class="page-header ">Collection Details</h1>
		</div>
	</div>

	<div class="row">
		<div class="col-md-6">

			<form method="post" th:action="@{/collections/update}">
				<input type="hidden" name="id" th:value="*{collectiondetails?.Id}" />


				<div class="form-group">
					<label> Repository Name</label>
					<div class="cols-sm-10">
						<select class="form-control" name="RepositoryId" required>
							<option value="">Select Repository</option>

							<option th:each="repo : ${repositories}" th:value="${repo.Id}"
								th:text="${repo.RepositoryName}"
								th:selected="${repo.Id} == *{collectiondetails?.RepositoryId}"></option>
						</select>
					</div>
				</div>



				<div class="form-group">
					<label for="firstName"> Collection Name</label>
					<div class="cols-sm-10">
						<input type="text" class="form-control"
							th:value="*{collectiondetails?.CollectionName}"
							name="CollectionName" required="required" />

					</div>
				</div>



				<div class="form-group ">
					<button type="submit" class="btn btn-primary btn-block ">Submit</button>
				</div>
			</form>

			<form method="post" th:action="@{/collections/delete}"
				th:if="${collectiondetails?.Id > 0}">
				<input type="hidden" name="id" th:value="*{collectiondetails?.Id}" />
				<div class="form-group ">
					<button type="submit" class="btn btn-warning btn-block ">Delete</button>
				</div>
			</form>



		</div>
	</div>
</div>


<div th:replace="common/footer :: footer"></div>

<div th:replace="common/header :: body-bottom-scripts"></div>

</body>
</html>
