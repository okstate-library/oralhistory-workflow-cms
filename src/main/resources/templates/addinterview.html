<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" lang="en">
<head th:replace="common/header :: common-header" />



<body roleId="page-top" data-spy="scroll"
	data-target=".navbar-fixed-top">
<head th:replace="common/header :: navbar" />

<div class="container">
	<div class="row">
		<div class="col-lg-12">
			<h1 class="page-header">Add Interview</h1>
		</div>
	</div>


	<form class="form-horizontal" method="post"
		onSubmit="return validate()" th:object="${transcription}"
		th:action="@{/addinterview}">

		<div class="row row-striped">

			<div class="col-md-5 form-group">

				<label class="control-label">Project Code</label> <input type="text"
					class="form-control" id="ProjectCode" name="ProjectCode"
					required="required" />

			</div>

			<div class="col-md-2"></div>

			<div class="col-md-5 form-group">

				<label class="control-label">Location</label> <input type="text"
					class="form-control" name="TranscriptLocation" />
			</div>
		</div>

		<div class="row row-striped">

			<div class="col-md-5 form-group">

				<label class="control-label">Interviewee(s)</label> <input
					type="text" class="form-control" name="Interviewee"
					required="required" />


			</div>

			<div class="col-md-2"></div>

			<div class="col-md-5 form-group">
				<label class="control-label">Interviewer(s)</label> <br /> <select
					class="form-control" id="interviewers-dropdown" multiple="multiple"
					th:name="Interviewer" required>
					<option th:each="interviewer : ${interviewers}"
						th:value="${interviewer.Name}" th:text="${interviewer.Name}"></option>
				</select>

			</div>

		</div>

		<div class="row row-striped">


			<div class="col-md-11 form-group">

				<label class="control-label">Date(s)</label> <input type="text"
					class="form-control dates" id="dateAdd" name="InterviewDates"
					required="required" />

			</div>

		</div>

		<div class="row row-striped">


			<div class="col-md-5 form-group">

				<label for="username" class="control-label">Collection</label>


				<div class="cols-sm-10">
					<div class="input-group">
						<select class="form-control" id="collectitonDropDown"
							onchange="selectSeriesByCollection()" name="CollectionId" required>
							<option value="">Select Collection</option>

							<option th:each="collection : ${collections}"
								th:value="${collection.Id}"
								th:text="${collection.CollectionName}"></option>
						</select>
					</div>
				</div>
			</div>

			<div class="col-md-2"></div>

			<div class="col-md-5 form-group">
				<label for="username" class="control-label">Series</label>


				<div class="input-group">

					<select class="form-control" id="seriesDropDown"
						th:name="SeriesId" required>
						<option value="">Select a Series</option>

						<option th:each="aseries : ${series}" th:value="${aseries.Id}"
							th:text="${aseries.SeriesName}"></option>
					</select>
				</div>

			</div>
		</div>

		<div class="row row-striped">
			<div class="col-md-5 form-group">
				<label for="password" class="cols-sm-2 control-label">Audio
					Equipment</label>
				<div class="cols-sm-10">
					<div class="input-group">
						<select class="form-control" id="audioDropDown"
							th:name="AudioEquipmentUsed">
							<option th:value="0">Select Audio Equipment</option>

							<option th:each="audioEquipment : ${audioEquipments}"
								th:value="${audioEquipment.EquipmentUsedName}"
								th:text="${audioEquipment.EquipmentUsedName}"></option>
						</select>
					</div>

				</div>
			</div>

			<div class="col-md-2"></div>
			<div class="col-md-5 form-group">
				<label for="password" class="cols-sm-2 control-label">Video
					Equipment</label>
				<div class="cols-sm-10">
					<div class="input-group">
						<select class="form-control" id="audioDropDown"
							th:name="VideoEquipmentUsed">
							<option th:value="0">Select Video Equipment</option>

							<option th:each="videoEquipment : ${videoEquipments}"
								th:value="${videoEquipment.EquipmentUsedName}"
								th:text="${videoEquipment.EquipmentUsedName}"></option>
						</select>
					</div>

				</div>
			</div>
		</div>

		<div class="row row-striped">
			<div class="col-md-2 form-group">
				<label for="password" class="control-label">Release form</label>
				<div class="form-control">

					<span> <input type="radio" name="ReleaseForm" value="1" />
						<label>Yes</label>
					</span> <span> <input name="ReleaseForm" type="radio" value="0" />
						<label>No</label>
					</span>


				</div>
			</div>
			<div class="col-md-5"></div>
			<div class="col-md-2 form-group">
				<label for="password" class="control-label">Record format</label>
				<div class="form-control">

					<span> <input name="Format" type="checkbox" value="Audio" />
						<label>Audio</label>
					</span> <span> <input name="Format" type="checkbox" value="Video" />
						<label>Video</label>
					</span>
				</div>
			</div>
		</div>

		<div class="row row-striped">
			<div class="col-md-2 form-group">
				<label for="password" class="control-label">Born Digital</label>

				<div class="form-control">

					<span> <input type="radio" name="IsBornDigital" value="1" />
						<label>Yes</label>
					</span> <span> <input name="IsBornDigital" type="radio" value="0" />
						<label>No</label>
					</span>

				</div>
			</div>
			<div class="col-md-5"></div>

			<div class="col-md-5 form-group">

				<label class="cols-sm-2 control-label">Transcriber assigned</label>s
				<div class="input-group">
					<select class="form-control" th:name="TranscriberAssigned">
						<option th:value="0">Select Transcriber</option>

						<option th:each="transcriber : ${transcribers}"
							th:value="${transcriber.Name}" th:text="${transcriber.Name}"></option>
					</select>
				</div>


			</div>
		</div>

		<div class="row row-striped">
			<div class="col-md-2 form-group">

				<label for="password" class="cols-sm-2 control-label">Restriction</label>
				<div class="form-control">

					<span> <input type="radio" name="IsRestriction" value="1" />
						<label>Yes</label>
					</span> <span> <input name="IsRestriction" type="radio" value="0" />
						<label>No</label>
					</span>


				</div>

			</div>
		</div>

		<div class="row row-striped">
			<div class="col-md-12 form-group">
				<label class="control-label">Restriction note</label>
				<textarea class="form-control" name="RestrictionNote" rows="5"
					th:inline="text"></textarea>
			</div>
		</div>

		<div class="row row-striped">

			<div class="col-md-2 form-group">

				<label class="control-label">Priority</label>
				<div class="form-control">
					<span> <input type="radio" name="IsPriority" value="1" /> <label>Yes</label>
					</span> <span> <input name="IsPriority" type="radio" value="0" />
						<label>No</label>
					</span>


				</div>

			</div>
		</div>
		<div class="row row-striped">

			<div class="col-md-12 form-group">

				<label class="control-label">Reason of priority</label>

				<textarea class="form-control" name="ReasonForPriority" rows="5"
					th:inline="text"></textarea>

			</div>

		</div>

		<div class="row row-striped"></div>
		<div class="form-group ">
			<button type="submit"
				class="btn btn-primary btn-lg btn-block login-button">Submit</button>
		</div>

	</form>


</div>


<div th:replace="common/footer :: footer"></div>

<div th:replace="common/header :: body-bottom-scripts"></div>


</body>
<script type="text/javascript">
	$(document).ready(function() {
		$('#interviewers-dropdown').multiselect({            
            enableFiltering : true,
			enableCaseInsensitiveFiltering : true,
			delimiter : '; ',
			delimiterText : '; ',
			maxHeight : 450,
			numberDisplayed : 10,
	    });
	});
</script>
</html>
