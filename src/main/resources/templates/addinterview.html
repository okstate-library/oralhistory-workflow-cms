<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" lang="en">
<head th:replace="common/header :: common-header" />
<body roleId="page-top" data-spy="scroll"
	data-target=".navbar-fixed-top">
<head th:replace="common/header :: navbar" />
<div class="container">
	<div class="row">
		<div class="col-lg-12">
			<h1 class="page-header">Add Interview</h1>
		</div>
	</div>

	<div class="row">
		<form class="form-horizontal" method="post"
			th:action="@{/addinterview}">

			<div class="col-md-5">
				<div class="form-group">
					<label for="firstName" class="cols-sm-2 control-label">Project
						Code</label>
					<div class="cols-sm-10">
						<div class="input-group">
							<span class="input-group-addon"><i class="fa fa-code fa"
								aria-hidden="true"></i></span> <input type="text" class="form-control"
								id="ProjectCode" name="ProjectCode" roleId="firstname"
								placeholder="Enter your first name" required="required" />
						</div>
					</div>
				</div>

				<div class="form-group">
					<label for="lastName" class="cols-sm-2 control-label">Interviewee(s)</label>
					<div class="cols-sm-10">
						<div class="input-group">
							<span class="input-group-addon"><i class="fa fa-user fa"
								aria-hidden="true"></i></span> <input type="text" class="form-control"
								id="lastName" name="lastName" roleId="lastName"
								placeholder="Enter your last name" required="required" />
						</div>
					</div>
				</div>

				<div class="form-group">
					<label for="email" class="cols-sm-2 control-label">Dates</label>
					<div class="cols-sm-10">
						<div class="input-group">
							<span class="input-group-addon"><i
								class="fa fa-envelope fa" aria-hidden="true"></i></span> <input
								id="dateAdd" type="text" class="form-control date" />
						</div>
					</div>
				</div>

				<div class="form-group">
					<label for="username" class="cols-sm-2 control-label">Collection</label>


					<div class="cols-sm-10">
						<div class="input-group">
							<select onchange="selectSebseries()" class="form-control"
								id="collectitonDropDown" name="CollectionId">
								<option th:value="0">Select Collection</option>

								<option th:each="collection : ${collections}"
									th:value="${collection.Id}"
									th:text="${collection.CollectionName}"></option>
							</select>
						</div>
					</div>
				</div>

				<div class="form-group">
					<label for="password" class="cols-sm-2 control-label">Audio
						Equipment</label>
					<div class="cols-sm-10">
						<div class="input-group">
							<select onchange="selectProvince()" class="form-control"
								id="provinceDropDown" th:name="member.province_id">
								<option th:value="0">Select Video Equipment</option>

								<option th:each="province : ${provinces}"
									th:value="${province.province_id}"
									th:text="${province.province_name}"
									th:selected="${province.province_id} == *{member?.province_id}"></option>
							</select>
						</div>

					</div>
				</div>


				<div class="form-group">
					<label for="password" class="cols-sm-2 control-label">Release
						form</label>
					<div class="cols-sm-10">
						<div class="input-group">
							<span> <input id="favoriteFrameworks1"
								name="favoriteFrameworks" type="checkbox" value="Spring MVC"
								checked="checked" /> <label for="favoriteFrameworks1">Yes</label>
							</span> <span> <input id="favoriteFrameworks2"
								name="favoriteFrameworks" type="checkbox" value="Struts 1" /> <label
								for="favoriteFrameworks2">No</label>
							</span>
						</div>

					</div>
				</div>


				<div class="form-group">
					<label for="password" class="cols-sm-2 control-label">Born
						Digital</label>
					<div class="cols-sm-10">
						<div class="input-group">
							<span> <input id="favoriteFrameworks1"
								name="favoriteFrameworks" type="checkbox" value="Spring MVC"
								checked="checked" /> <label for="favoriteFrameworks1">Yes</label>
							</span> <span> <input id="favoriteFrameworks2"
								name="favoriteFrameworks" type="checkbox" value="Struts 1" /> <label
								for="favoriteFrameworks2">No</label>
							</span>
						</div>

					</div>
				</div>

				<div class="form-group ">
					<button type="submit"
						class="btn btn-primary btn-lg btn-block login-button">Submit</button>
				</div>

				<hr />
			</div>

			<div class="col-md-2"></div>

			<div class="col-md-5">

				<div class="form-group">
					<label for="firstName" class="cols-sm-2 control-label">Location</label>
					<div class="cols-sm-10">
						<div class="input-group">
							<span class="input-group-addon"><i class="fa fa-user fa"
								aria-hidden="true"></i></span> <input type="text" class="form-control"
								id="firstName" name="firstName" roleId="firstname"
								placeholder="Enter your first name" required="required" />
						</div>
					</div>
				</div>

				<div class="form-group">
					<label for="lastName" class="cols-sm-2 control-label">Interviewer(s)</label>
					<div class="cols-sm-10">
						<div class="input-group">
							<span class="input-group-addon"><i class="fa fa-user fa"
								aria-hidden="true"></i></span> <input type="text" class="form-control"
								id="lastName" name="lastName" roleId="lastName"
								placeholder="Enter your last name" required="required" />
						</div>
					</div>
				</div>


				<div class="form-group">
					<label for="lastName" class="cols-sm-2 control-label">Interviewer(s)</label>
					<div class="cols-sm-10">
						<div class="input-group">
							<span class="input-group-addon"><i class="fa fa-user fa"
								aria-hidden="true"></i></span> <input type="text" class="form-control"
								id="lastName" name="lastName" roleId="lastName"
								placeholder="Enter your last name" required="required" />
						</div>
					</div>
				</div>

				<div class="form-group">
					<label for="username" class="cols-sm-2 control-label">Subserie</label>


					<div class="cols-sm-10">
						<div class="input-group">

							<select class="form-control" id="subseriesDropDown"
								name="SubseriesId">
							</select>

							<!-- <select onchange="selectProvince()" class="form-control"
								id="subseriesDropDown" th:name="member.province_id">
								<option th:value="0">Select Subserie</option>

								<option th:each="province : ${provinces}"
									th:value="${province.province_id}"
									th:text="${province.province_name}"
									th:selected="${province.province_id} == *{member?.province_id}"></option>
							</select> -->
						</div>
					</div>
				</div>

				<div class="form-group">
					<label for="password" class="cols-sm-2 control-label">Video
						Equipment</label>
					<div class="cols-sm-10">
						<div class="input-group">
							<select onchange="selectProvince()" class="form-control"
								id="provinceDropDown" th:name="member.province_id">
								<option th:value="0">Select Video Equipment</option>

								<option th:each="province : ${provinces}"
									th:value="${province.province_id}"
									th:text="${province.province_name}"
									th:selected="${province.province_id} == *{member?.province_id}"></option>
							</select>
						</div>

					</div>
				</div>

				<div class="form-group">
					<label for="password" class="cols-sm-2 control-label">Record
						format</label>
					<div class="cols-sm-10">
						<div class="input-group">
							<span> <input id="favoriteFrameworks1"
								name="favoriteFrameworks" type="checkbox" value="Spring MVC"
								checked="checked" /> <label for="favoriteFrameworks1">Audio</label>
							</span> <span> <input id="favoriteFrameworks2"
								name="favoriteFrameworks" type="checkbox" value="Struts 1" /> <label
								for="favoriteFrameworks2">Video</label>
							</span>
						</div>

					</div>
				</div>


				<div class="form-group">
					<label for="password" class="cols-sm-2 control-label">Transcriber
						assigned</label>
					<div class="cols-sm-10">
						<div class="input-group">
							<div class="input-group">
								<span class="input-group-addon"><i class="fa fa-user fa"
									aria-hidden="true"></i></span> <input type="text" class="form-control"
									id="firstName" name="firstName" roleId="firstname"
									placeholder="Transcriber assigned" required="required" />
							</div>
						</div>

					</div>
				</div>

			</div>
		</form>

	</div>

</div>


<div th:replace="common/header :: body-bottom-scripts" />

</body>
</html>
