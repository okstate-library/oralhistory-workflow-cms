<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" lang="en">
<head th:replace="common/header :: common-header" />
<body roleId="page-top" data-spy="scroll"
	data-target=".navbar-fixed-top">
<head th:replace="common/header :: navbar" />

<div class="container my-custom-container">

	<div class="row">
		<div class="col-lg-10">
			<h1 class="page-header">Transcription Queue</h1>
		</div>
		<div class="col-lg-2">

			<form method="get" th:action="@{/headcount/stat_excel}">

				<h1>
					<a type="submit" class="btn  btn-info">Download data in Excel</a>
				</h1>

			</form>

		</div>
	</div>

	<div class="row">

		<div class="col-xs-1 form-inline">
			<div class="dropdown">
				<button class="btn btn-primary dropdown-toggle" type="button"
					id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true"
					aria-expanded="false">Select options</button>
				<form class="dropdown-menu"
					aria-labelledby="dropdownMenuButton">

					<th:block th:each="queueoption : ${queueptions}">

						<label class="dropdown-item"><input
							class="transcriptQueueOption" type="checkbox"
							th:id="'transcriptionQueueOption-' + ${queueoption.Id}"
							th:value="${queueoption.Id}" th:name="${queueoption.Name}"
							th:text="${queueoption.Name}"
							th:checked="${queueoption.IsChecked}" /></label>
					</th:block>
				</form>



			</div>

		</div>
		<div class="col-xs-11 form-inline">
			<p id="transcriptQueueOptionSelections"></p>
		</div>




	</div>

	<div class="table-responsive">
		<table id="transcriptionQueueDataTable"
			class="table table-bordered table-hover table-striped">
			<thead>
				<tr>
					<th>Interviewees</th>
					<th>Interviewers</th>
					<th>Interview on</th>
					<th>Code</th>
					<th>Transcriber assigned</th>
					<th>Priority</th>
					<th>Audit check</th>
					<th>First edit</th>
					<th>Second edit</th>
					<th>Draft sent</th>
					<th>Final edit</th>
				</tr>
			</thead>
		</table>
	</div>
</div>


<div th:replace="common/header :: body-bottom-scripts" />
<script>
	$(document).ready(
			function() {

				$.ajax({
					url : '/transcriptionqueue/data',
					success : function(data) {

						var table = $('#transcriptionQueueDataTable')
								.DataTable(
										{
											data : data,
											columns : [

											{
												"data" : "interviewee"
											}, {
												"data" : "interviewer"
											}, {
												"data" : "interviewDate"
											}, {
												"data" : "projectCode"
											}, {
												"data" : "transcriberAssigned"
											}, {
												"data" : "isPriority" , render: getBooleanImage,
											}, {
												"data" : "auditCheckCompleted"
											}, {
												"data" : "firstEditCompleted"
											}, {
												"data" : "secondEditCompleted"
											}, {
												"data" : "draftSentDate"
											}, {
												"data" : "finalEditCompleted"
											}, ],
											sort : [ 0, 'desc' ],
											"lengthMenu" : [ [ 50, 100, 200, -1 ],
													[ 50, 100, 200, "All" ] ],
											"pageLength" : 100
										});
					}
				});

			});
</script>
</body>
</html>
