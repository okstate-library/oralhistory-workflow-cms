<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" lang="en">
<head th:replace="common/header :: common-header" />
<body roleId="page-top" data-spy="scroll"
	data-target=".navbar-fixed-top">
<head th:replace="common/header :: navbar" />

<div class="container my-custom-container">

	<div class="row">
		<div class="col-lg-12">
			<h1 class="page-header">Transcription Queue</h1>
		</div>

	</div>

	<div class="row">

		<div class="col-xs-1">
			<div class="dropdown">


				<th:block th:each="queueoption : ${queueptions}">

					<label class="dropdown-item small"><input
						class="transcriptQueueOption" type="checkbox"
						th:id="'transcriptionQueueOption-' + ${queueoption.Id}"
						th:value="${queueoption.Id}" th:name="${queueoption.Name}"
						th:text="'   ' + ${queueoption.Name}"
						th:checked="${queueoption.IsChecked}" /></label>
					<br />
				</th:block>

			</div>

		</div>



		<div class="table-responsive col-xs-11">
			<table id="transcriptionQueueDataTable"
				class="table table-bordered table-hover table-striped">
				<thead>
					<tr>
						<th>Interviewees</th>
						<th>Interviewers</th>
						<th>Interview on</th>
						<th>Code</th>
						<th>Transcriber assigned</th>
						<th>Priority</th>
						<th>Audit check</th>
						<th>First edit</th>
						<th>Second edit</th>
						<th>Draft sent</th>
						<th>Final edit</th>
					</tr>
				</thead>
			</table>
		</div>


	</div>


</div>

</body>

<div th:replace="common/footer :: footer"></div>

<div th:replace="common/header :: body-bottom-scripts"></div>

<div th:replace="common/header :: body-bottom-datatable-scripts"></div>

<script>
	callTransactionQueueAjaxRequest();
</script>

</html>
