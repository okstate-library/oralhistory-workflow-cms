<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" lang="en">
<head th:replace="~{common/header :: common-header}" />
<body roleId="page-top" data-spy="scroll"
	data-target=".navbar-fixed-top">
<head th:replace="~{common/header :: navbar}" />

<div class="container">

	<div class="row">
		<div class="col-lg-12">
			<h1 class="page-header" th:text="${usertype} + Details"></h1>
		</div>
	</div>

	<div class="row">
		<div class="col-md-6">
			<form method="post" th:action="@{/predefineuser/update}">
				<input type="hidden" name="id" th:value="*{predefineuserdetails?.Id}" />
				<input type="hidden" name="UserType" th:value="*{predefineuserdetails?.UserType}" />

				<div class="form-group">
					<label for="firstName"> Name</label>
					<div class="cols-sm-10">
						<input type="text" class="form-control"
							th:value="*{predefineuserdetails?.Name}"
							id="Name" name="Name" required="required" />

					</div>
				</div>

				<div class="form-group ">
					<button type="submit" class="btn btn-primary btn-block ">Submit</button>
				</div>

			</form>

			<form method="post" th:action="@{/predefineuser/delete}"
				th:if="${predefineuserdetails?.Id > 0}">
				<input type="hidden" name="id" th:value="*{predefineuserdetails?.Id}" />
				<div class="form-group ">
					<button type="submit" class="btn btn-warning btn-block ">Delete</button>
				</div>
			</form>
		</div>
	</div>

</div>

</body>

<div th:replace="~{common/footer :: footer}"></div>

<div th:replace="~{common/header :: body-bottom-scripts}"></div>
</html>
