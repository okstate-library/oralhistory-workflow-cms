<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" lang="en">
<head th:replace="common/header :: common-header" />
<body roleId="page-top" data-spy="scroll"
	data-target=".navbar-fixed-top">
<head th:replace="common/header :: navbar" />

<div class="container my-custom-container">

	<div class="row">
		<div class="col-lg-12">
			<h1 class="page-header">All Interviews</h1>
		</div>
	</div>


	<div class="row">
		<div class="col-md-2">
			<p>Selected Options</p>
			<p id="browseSelections"></p>
			<div id="accordion">
				<div class="card">
					<div class="card-header" id="headingOne">
						<h5 class="mb-0">
							<button class="btn btn-link" data-toggle="collapse"
								data-target="#collapseOne" aria-expanded="true"
								aria-controls="collapseOne">Select Collection</button>
						</h5>
					</div>

					<div id="collapseOne" class="collapse" aria-labelledby="headingOne"
						data-parent="#accordion">
						<div class="card-body">
							<th:block th:each="collection : ${collections}" heigth="100px">

								<label class="dropdown-item small"><input
									class="browseCollectionOption" type="checkbox"
									th:id="'browseOption-' + ${collection.Id}"
									th:value="${collection.Id}"
									th:name="${collection.CollectionName}"
									th:text="'   ' + ${collection.CollectionName}" /></label>
							</th:block>
						</div>
					</div>
				</div>
				<div class="card">
					<div class="card-header" id="headingTwo">
						<h5 class="mb-0">
							<button class="btn btn-link collapsed" data-toggle="collapse"
								data-target="#collapseTwo" aria-expanded="false"
								aria-controls="collapseTwo">Select Subseries</button>
						</h5>
					</div>
					<div id="collapseTwo" class="collapse" aria-labelledby="headingTwo"
						data-parent="#accordion">
						<div class="card-body">
							<th:block th:each="subserie : ${subseries}">

								<label class="dropdown-item small"><input
									class="browseSubserieOption" type="checkbox"
									th:id="'browseSubserieOption-' + ${subserie.Id}"
									th:value="${subserie.Id}" th:name="${subserie.SubseriesName}"
									th:text="'   ' + ${subserie.SubseriesName}" /></label>
							</th:block>
						</div>
					</div>
				</div>
				<div class="card">
					<div class="card-header" id="headingThree">
						<h5 class="mb-0">
							<button class="btn btn-link collapsed" data-toggle="collapse"
								data-target="#collapseThree" aria-expanded="false"
								aria-controls="collapseThree">Select Interviewers</button>
						</h5>
					</div>
					<div id="collapseThree" class="collapse"
						aria-labelledby="headingThree" data-parent="#accordion">
						<div class="card-body">
							<th:block th:each="interviewer : ${interviewers}">

								<label class="dropdown-item"><input
									class="browseInterviewerOption-" type="checkbox"
									th:id="'browseInterviewerOption-' + ${interviewer.Id}"
									th:value="${interviewer.Id}" th:name="${interviewer.Name}"
									th:text="${interviewer.Name}" /></label>
							</th:block>
						</div>
					</div>
				</div>
				<div class="card">
					<div class="card-header" id="headingThree">
						<h5 class="mb-0">
							<button class="btn btn-link collapsed" data-toggle="collapse"
								data-target="#collapseFour" aria-expanded="false"
								aria-controls="collapseFour">Select Subjects</button>
						</h5>
					</div>
					<div id="collapseFour" class="collapse"
						aria-labelledby="headingThree" data-parent="#accordion">
						<div class="card-body">
							<th:block th:each="subject : ${subjects}">

								<label class="dropdown-item"><input
									class="browseSubjectOption-" type="checkbox"
									th:id="'browseSubjectOption-' + ${subject.Id}"
									th:value="${subject.Id}" th:name="${subject.SubjectName}"
									th:text="${subject.SubjectName}" /></label>
							</th:block>
						</div>
					</div>
				</div>
				<div class="card">
					<div class="card-header" id="headingThree">
						<h5 class="mb-0">
							<button class="btn btn-link collapsed" data-toggle="collapse"
								data-target="#collapseFive" aria-expanded="false"
								aria-controls="collapseFive">Online/Offline</button>
						</h5>
					</div>
					<div id="collapseFive" class="collapse"
						aria-labelledby="headingThree" data-parent="#accordion">
						<div class="card-body">
							<th:block>

								<label class="dropdown-item"> <input type="checkbox"
									name="active" /> Online
								</label>
							</th:block>
						</div>
					</div>
				</div>
				<div class="card">
					<div class="card-header" id="headingThree">
						<h5 class="mb-0">
							<button class="btn btn-link collapsed" data-toggle="collapse"
								data-target="#collapseSix" aria-expanded="false"
								aria-controls="collapseSix">Select Dark Archive</button>
						</h5>
					</div>
					<div id="collapseSix" class="collapse"
						aria-labelledby="headingThree" data-parent="#accordion">
						<div class="card-body">
							<th:block>

								<label class="dropdown-item"> <input type="checkbox"
									name="active" /> Dark Archive
								</label>
							</th:block>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="col-md-10">

			<div class="table-responsive">
				<table id="browseDataTable"
					class="table table-bordered table-hover table-striped">
					<thead>
						<tr>
							<th>Interviewees</th>
							<th>Interviewers</th>
							<th>Project Code</th>
							<th>Dates</th>
							<th>Collection</th>
							<th>Subseries</th>
							<th>Transcribed</th>
							<th>Online</th>
							<th>Restriction</th>

						</tr>
					</thead>

				</table>
			</div>
		</div>
	</div>






</div>


<div th:replace="common/footer :: footer"></div>

<div th:replace="common/header :: body-bottom-scripts"></div>

<div th:replace="common/header :: body-bottom-datatable-scripts"></div>

<script>
	callBrowseAjaxRequest();
</script>
</body>
</html>
