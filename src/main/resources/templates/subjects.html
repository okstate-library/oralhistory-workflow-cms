<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" lang="en">
<head th:replace="common/header :: common-header" />
<body roleId="page-top" data-spy="scroll"
	data-target=".navbar-fixed-top">
<head th:replace="common/header :: navbar" />
<div class="container my-custom-container">
	<div class="row">
		<div class="col-lg-10">
			<h1 class="page-header">Subject</h1>
		</div>
		<div class="col-lg-2">
			<h1 class="page-header"><a class="btn  btn-info" th:href="@{/subject}">Add Subject</a></h1>
		</div>
	</div>

	<div class="row">
		<div class="table-responsive">
			<table id="example"
				class="table table-bordered table-hover table-striped">
				<thead>
					<tr>
						<th>Subject Name</th>
						<th>Details</th>
					</tr>
				</thead>
				<tbody>
					<tr data-th-each="subject : ${subjects}">
						<td data-th-text="${subject.SubjectName}">...</td>
						<td><a th:href="${'/subject/' + subject.Id}">View</a></td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>

<div th:replace="common/header :: body-bottom-scripts" />
<script>
	$(document).ready(function() {
		$('#example').DataTable();
	});
</script>
</body>
</html>
