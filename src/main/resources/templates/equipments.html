<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" lang="en">
<head th:replace="~{common/header :: common-header}" />
<body roleId="page-top" data-spy="scroll"
	data-target=".navbar-fixed-top">
<head th:replace="~{common/header :: navbar}" />
<div class="container">
	<div class="row">
		<div class="col-lg-10">
			<h1 class="page-header">Equipment</h1>
		</div>
		<div class="col-lg-2">
			<h1 class="page-header">
				<a class="btn  btn-info" th:href="@{/equipments/add}">Add Equipment</a>
			</h1>
		</div>
	</div>

	<div class="row">
		<div class="table-responsive">
			<table id="example"
				class="table table-bordered table-hover table-striped">
				<thead>
					<tr>
						<th>Equipment Type</th>
						<th>Equipment Name</th>
						<th>Details</th>
					</tr>
				</thead>
				<tbody>
					<tr data-th-each="equipment : ${equipments}">
						<td data-th-text="${equipment.EquipmentTypeName}">...</td>
						<td data-th-text="${equipment.EquipmentUsedName}">...</td>
						<td><a th:href="${'/equipments/' + equipment.Id}">View</a></td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>
</body>

<div th:replace="~{common/footer :: footer}"></div>

<div th:replace="~{common/header :: body-bottom-scripts}"></div>

<script>
	$(document).ready(function() {
		$('#example').DataTable({
			"lengthMenu" : [ [ 10, 25, 50, -1 ], [ 10, 25, 50, "All" ] ]
		});
	});
</script>

</html>
