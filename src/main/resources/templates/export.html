<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" lang="en">
<head th:replace="common/header :: common-header" />
<body roleId="page-top" data-spy="scroll"
	data-target=".navbar-fixed-top">
<head th:replace="common/header :: navbar" />

<div class="container">

	<div class="row">
		<div class="col-lg-12">
			<h1 class="page-header" th:text="Export"></h1>
		</div>
	</div>

	<div class="row">

		<div class="col-md-6">Download all <b>transactions</b> as an excel file.</div>
		<div class="col-md-6">

			<form method="post" th:action="@{/transactions/export}">

				<div class="form-group ">
					<button type="submit" class="btn btn-primary btn-block ">Transaction
					</button>
				</div>
			</form>
		</div>

	</div>

	<div class="row">

		<div class="col-md-6">Download all <b>collections</b> as an
			excel file.</div>
		<div class="col-md-6">



			<form method="post" th:action="@{/collections/export}">

				<div class="form-group ">
					<button type="submit" class="btn btn-primary btn-block ">Collection
					</button>
				</div>
			</form>
		</div>
	</div>

	<div class="row">

		<div class="col-md-6">Download all <b>Series</b> as an excel
			file.</div>
		<div class="col-md-6">



			<form method="post" th:action="@{/series/export}">

				<div class="form-group ">
					<button type="submit" class="btn btn-primary btn-block ">Series
					</button>
				</div>
			</form>


		</div>
	</div>

</div>

</body>

<div th:replace="common/footer :: footer"></div>

<div th:replace="common/header :: body-bottom-scripts"></div>

</html>
