<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" lang="en">
<head th:replace="common/header :: common-header" />
<body roleId="page-top" data-spy="scroll"
	data-target=".navbar-fixed-top">
<head th:replace="common/header :: navbar" />
<div class="container">
	<div class="row">
		<div class="col-lg-12">
			<h1 class="page-header">Reports</h1>
		</div>
	</div>

	<div class="row">

		<div class="col-md-5 form-group">
			<label class="control-label">Interviewer(s)</label> <select
				id="interviewer" class="form-control" th:name="interviewer">
				<option value="">Select Interviewer(s)</option>

				<option th:each="interviewer : ${interviewers}"
					th:value="${interviewer.Name}" th:text="${interviewer.Name}"></option>
			</select>

		</div>

		<div class="col-md-2"></div>

		<div class="col-md-5 form-group">

			<label class="control-label">Location</label> <input type="text"
				id="location" class="form-control" />
		</div>
	</div>

	<div class="row">

		<div class="col-md-5 form-group">

			<label class="control-label">Begin date</label> <input type="text"
				class="form-control" name="begindate" />


		</div>

		<div class="col-md-2"></div>

		<div class="col-md-5 form-group">
			<label class="control-label">End date</label> <input type="text"
				class="form-control" name="enddate" />

		</div>

	</div>



	<div class="row">
		<div class="col-md-5 form-group">
			<label for="password" class="cols-sm-2 control-label">Status</label>
			<div class="cols-sm-10">
				<div class="input-group">
					<span> <input name="statusRadioButton" type="radio"
						value="1" /> <label>Online</label>
					</span> <span> <input name="statusRadioButton" type="radio"
						value="0" /> <label>Offline</label>
					</span>
				</div>

			</div>
		</div>
		<div class="col-md-2"></div>
		<div class="col-md-5 form-group">
			<label for="password" class="cols-sm-2 control-label">Media</label>
			<div class="cols-sm-10">
				<div class="input-group">
					<span> <input id="bornDigitalCheckboxButton" type="checkbox" />
						<label>Born digital</label>
					</span> <span> <input id="convertedCheckboxButton" type="checkbox" />
						<label>Converted</label>
					</span>
				</div>

			</div>
		</div>
	</div>


	<div class="row">
		<div class="col-md-5 form-group">

			<button type="submit" id="submitreport"
				class="btn btn-primary btn-md btn-block">Submit</button>
		</div>

	</div>

	<form method="post" id="reportDownloadForm"
		th:action="@{/downloadreports}">

		<div class="row">
			<div class="col-md-12 form-group">
				<h1 class="page-header">Search result</h1>
			</div>
		</div>
		<div class="row">
			<div class="col-md-2"></div>
			<div class="col-md-3">
				<h3 id="recordCount"></h3>
			</div>
			<div class="col-md-2"></div>
			<div class="col-md-3">
				<button type="submit" id="downloadReportButton"
					class="btn btn-success btn-md btn-block"
					style="visibility: hidden;" name="action" value="download">Download
					records</button>
			</div>
			<div class="col-md-2"></div>
		</div>

	</form>

</div>



</body>
<script>
	
</script>
<div th:replace="common/footer :: footer"></div>

<div th:replace="common/header :: body-bottom-scripts"></div>
</html>
