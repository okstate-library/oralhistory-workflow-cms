<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" lang="en">
<head th:replace="common/header :: common-header" />
<body roleId="page-top" data-spy="scroll"
	data-target=".navbar-fixed-top">
<head th:replace="common/header :: navbar" />

<div class="container">

	<div class="row">
		<div class="col-lg-12">
			<h1 class="page-header">Validate Master data</h1>
		</div>
	</div>

	<div class="row form-group">

		<div class="col-md-6  ">
			Validate <b>Subjects</b>
		</div>
		<div class="col-md-6">
			<button id="subjectvaidate" type="submit"
				class="btn btn-primary btn-block ">Validate</button>

		</div>

	</div>

	<div class="row form-group">

		<div class="col-md-6  ">
			Validate <b>Collections</b>
		</div>
		<div class="col-md-6">
			<form method="post" th:action="@{/collections/validate}">
				<button type="submit" class="btn btn-primary btn-block ">Validate</button>
			</form>
		</div>

	</div>

	<div class="row form-group">

		<div class="col-md-6  ">
			Validate <b>Series</b>
		</div>
		<div class="col-md-6">
			<form method="post" th:action="@{/series/validate}">
				<button id="seriesvaidate" type="submit"
					class="btn btn-primary btn-block ">Series</button>
			</form>
		</div>

	</div>

	<div class="row  form-group"></div>

	<div class="row  form-group" id="submitSubjectRow"
		style="visibility: hidden;">
		<form method="post" id="reportDownloadForm"
			th:action="@{/subjects/submitall}">

			<div class="row">
				<div class="col-md-2"></div>
				<div class="col-md-3">
					<h3 id="subjectrecordcount"></h3>
				</div>
				<div class="col-md-2"></div>
				<div class="col-md-3">
					<button type="submit" id="submitSubjectsButton"
						class="btn btn-success btn-md btn-block" name="action"
						value="download">Add to master data.</button>
				</div>
				<div class="col-md-2"></div>
			</div>

		</form>
	</div>

	<div class="row  form-group" id="subjectNoRecordsRow"
		style="visibility: hidden;">

		<div class="row">
			<div class="col-md-2"></div>
			<div class="col-md-3">
				<h3>Subject records are up to date.</h3>
			</div>
		</div>

		<div class="row  form-group"></div>
	</div>

	</body>

	<div th:replace="common/footer :: footer"></div>

	<div th:replace="common/header :: body-bottom-scripts"></div>
</html>
